version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: lifeline_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: lifeline
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - lifeline_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: lifeline_api
    environment:
    
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ./api/uploads:/app/uploads
      - ./api/logs:/app/logs
    networks:
      - lifeline_network
    restart: unless-stopped

  # Client Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: lifeline_client
    environment:
      - VITE_API_URL=http://api:3000/api/
    ports:
      - "5173:80"
    networks:
      - lifeline_network
    restart: unless-stopped

  # Admin Service
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: lifeline_admin
    environment:
      - VITE_API_URL=http://api:3000/api/
    ports:
      - "5174:80"
    networks:
      - lifeline_network
    restart: unless-stopped

# Networks
networks:
  lifeline_network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    driver: local
